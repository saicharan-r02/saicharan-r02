name: Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: saicharan-r02
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2300AFFF&color_dots=%23161B22,%23003D1F,%2300A639,%2300C853,%2300E676
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300AFFF&color_dots=%23161B22,%23003D1F,%2300A639,%2300C853,%2300E676

      - name: Push snake files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
