name: Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: saicharan-r02
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#A000FF&color_dots=#161B22,#0B3D2E,#087F5B,#20C997,#63E6BE
            dist/github-contribution-grid-snake-dark.svg?color_snake=#A000FF&color_dots=#161B22,#0B3D2E,#087F5B,#20C997,#63E6BE

      - name: Push snake files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
